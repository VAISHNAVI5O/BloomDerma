# ===================== BloomDerma backend configuration =====================
# Defaults work for a local MySQL 8 (user root / password root). Override with environment variables if needed:
#   DB_URL, DB_USER, DB_PASSWORD, CORS_ORIGINS, JWT_SECRET, ANTHROPIC_API_KEY, UPLOAD_DIR

spring.application.name=bloomderma-api
server.port=8080

# ---------- MySQL (database is created automatically if it does not exist) ----------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/derma_clinic_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# ---------- JPA / Hibernate (adds new tables/columns automatically, keeps existing data) ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.show-sql=false

# ---------- File uploads (reports / before-after photos, max 10 MB each) ----------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB

# ---------- JWT (secret must be at least 32 characters) ----------
bloomderma.jwt.secret=${JWT_SECRET:bloomderma-dev-secret-change-me-0123456789-abcdefghijklmnopqrstuvwxyz}
bloomderma.jwt.expiration-ms=86400000

# ---------- CORS (React dev server and the Docker/nginx frontend) ----------
bloomderma.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}

# ---------- Fees (INR) ----------
bloomderma.fees.in-clinic=1000
bloomderma.fees.video-default=500

# ---------- Old-version upload folder (only used to import files saved by older versions) ----------
bloomderma.upload-dir=${UPLOAD_DIR:./uploads}

# ---------- AI report wording (optional; a built-in template is used when no key is set) ----------
bloomderma.ai.api-key=${ANTHROPIC_API_KEY:}
bloomderma.ai.model=claude-sonnet-5-5

# ---------- Module switches (true / false) ----------
bloomderma.modules.appointments=true
bloomderma.modules.doctors=true
bloomderma.modules.services=true
bloomderma.modules.revenue=true
